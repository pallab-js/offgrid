name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Live hub verification (runs on main branch only, after static checks pass)
  live-verification:
    name: Live hub verification
    needs: static-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disable TLS for CI live verification (openssl not guaranteed in runner)
      ENABLE_TLS: "false"
      NODE_ENV: "production"
      DATA_DIR: "/tmp/offgrid-ci-data"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

      - name: Prepare data directory
        run: mkdir -p "${{ env.DATA_DIR }}"

      - name: Start hub in background
        run: |
          pnpm start &
          HUB_PID=$!
          echo "HUB_PID=$HUB_PID" >> $GITHUB_ENV
          # Wait for hub to be ready
          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "Hub is ready"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: pnpm exec tsx scripts/smoke-p1.ts

      - name: Verify security flows
        run: |
          pnpm exec tsx scripts/verify-revoke.ts
          pnpm exec tsx scripts/verify-moderation.ts
          pnpm exec tsx scripts/verify-rotate.ts

      - name: Stop hub
        if: always()
        run: |
          if [ -n "$HUB_PID" ]; then kill $HUB_PID 2>/dev/null || true; fi
          # Cleanup temp data
          rm -rf "${{ env.DATA_DIR }}"